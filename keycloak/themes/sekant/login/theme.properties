# Login theme for the Sekant Management Console.
#
# Tenant users are stored in Keycloak as `t_<identifier>_<username>`. The console
# hands off to Keycloak without a username, so the sign-in page asks for the bare
# username and the theme appends the organization's tenant prefix on submit,
# without ever showing it to the end user.
#
# Two scripts extend the inherited login page:
#   - tenant-idp-filter.js lists only the current organization's identity
#     providers.
#   - tenant-username.js applies the tenant prefix to the username on submit.
# Both read the organization from the standard `kc_org` query parameter.
#
# It extends the default login theme, so everything else is inherited unchanged.
parent=keycloak.v2
scripts=js/tenant-idp-filter.js js/tenant-username.js
